name: "Solicitação de Acesso a Cluster HPC (CEIA/Akcit)"
description: "Formulário para registro e solicitação de credenciais de acesso aos clusters HPC."
title: "[Acesso Cluster]"
labels: ["novo-acesso", "pendente"]
body:
  - type: markdown
    attributes:
      value: |
        ### Bem-vindo(a) ao processo de solicitação de acesso aos clusters HPC

        Para prosseguir com a liberação, por favor preencha os dados abaixo.

        **ATENÇÃO - PASSO OBRIGATÓRIO:**
        É necessário assinar o termo de responsabilidade e anexá-lo (arrastar o PDF) no final desta página antes de abrir a Issue. Recomendamos fortemente o uso de assinatura digital (preferencialmente via [gov.br](https://www.gov.br/pt-br/servicos/assinatura-eletronica)).

        **[BAIXE AQUI O TERMO DE RESPONSABILIDADE](https://drive.google.com/file/d/1KJla5KLLMLAabjmpBsFcf43vMAEfP9iH/view?usp=sharing)**

        Após a conclusão, retornaremos com os respectivos dados de acesso.

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: nome_completo
    attributes:
      label: "Nome completo do pesquisador"
      placeholder: "Ex: João da Silva"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: email
    attributes:
      label: "Email"
      description: "Dê preferência ao seu e-mail institucional."
      placeholder: "Ex: usuario@discente.ufg.br"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: telefone
    attributes:
      label: "Telefone de contato com DDD"
      placeholder: "Ex: (62) 99999-9999"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: dropdown
    id: membro_externo
    attributes:
      label: "Membro Externo?"
      description: "Indique se você possui vínculo direto com a UFG ou se é pesquisador externo/estrangeiro."
      options:
        - "Não (pesquisador/aluno com vínculo UFG)"
        - "Sim (pesquisador externo ou estrangeiro)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: matricula_ou_documento
    attributes:
      label: "Matrícula UFG ou Documento (CPF / Passaporte / RNM)"
      description: "Se membro UFG: informe a Matrícula UFG. Se membro externo brasileiro: informe o CPF. Se estrangeiro: informe o Passaporte ou RNM (Registro Nacional Migratório)."
      placeholder: "Ex: Matrícula: 2024000000 | CPF: 000.000.000-00 | Passaporte: AB123456"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: dropdown
    id: plataforma_cluster
    attributes:
      label: "Plataforma / Cluster Desejado"
      description: "Selecione o cluster computacional para o qual está solicitando acesso."
      options:
        - "Spark (hpc-spark-45)"
        - "H100"
        - "B200"
        - "A100"
        - "Outro (especificar no campo de projeto)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: projeto
    attributes:
      label: "Projeto de pesquisa"
      placeholder: "Ex: SafeAI, 4Vants II, etc."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: coordenador
    attributes:
      label: "Coordenador do Projeto"
      placeholder: "Nome do coordenador responsável"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: input
    id: instituicao
    attributes:
      label: "Instituição"
      placeholder: "Ex: UFG"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: textarea
    id: termo_responsabilidade
    attributes:
      label: "Termo de Responsabilidade Assinado (PDF)"
      description: "Arraste e solte o arquivo PDF assinado aqui, cole, ou clique na área abaixo para selecionar o arquivo."
      placeholder: "Arraste e solte o PDF assinado aqui..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br>"

  - type: checkboxes
    id: confirmacoes
    attributes:
      label: "Confirmações Finais"
      options:
        - label: "Revisei meus dados e confirmo que estão corretos."
          required: true
        - label: "Anexei o Termo de Responsabilidade devidamente assinado no campo acima."
          required: true
