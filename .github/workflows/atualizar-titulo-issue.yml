name: Atualizar título e checklist da issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [edited]

permissions:
  issues: write

jobs:
  inicializar-issue:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'novo-acesso') || contains(github.event.issue.labels.*.name, 'acesso-cluster-adicional'))
    runs-on: ubuntu-latest
    steps:
      - name: Processar título e criar checklist de administradores
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const labels = context.payload.issue.labels.map(l => l.name);

            function extrairCampo(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`### ${escaped}\\s*\\n+([^\\n#]+)`);
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            }

            const clusterRaw = extrairCampo('Plataforma / Cluster Desejado') || 'Cluster';
            let clusterNome = 'Cluster';
            if (clusterRaw.includes('Spark')) clusterNome = 'Spark';
            else if (clusterRaw.includes('H100')) clusterNome = 'H100';
            else if (clusterRaw.includes('B200')) clusterNome = 'B200';
            else clusterNome = clusterRaw.split('(')[0].trim();

            let valor = null;
            let prefixo = null;
            let checklistBody = null;

            if (labels.includes('novo-acesso')) {
              valor = extrairCampo('Nome completo do pesquisador');
              prefixo = `[Acesso ${clusterNome}]`;
              checklistBody = `### Checklist de Provisionamento (Administradores)\n\n` +
                `- [ ] Email enviado (Usuário/Senha, Arquivo de VPN e Manual de Uso)`;
            } else if (labels.includes('acesso-cluster-adicional')) {
              valor = extrairCampo('Usuário ou email já cadastrado no ambiente');
              prefixo = `[Acesso Adicional ${clusterNome}]`;
              checklistBody = `### Checklist de Provisionamento (Administradores)\n\n` +
                `- [ ] Email enviado (Instruções e Manual de Uso do novo ambiente)`;
            }

            if (valor) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title: `${prefixo} ${valor}`,
              });
            }

            if (checklistBody) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: checklistBody,
              });
            }

  registrar-data-checklist:
    if: github.event_name == 'issue_comment' && github.event.comment.user.type == 'Bot' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Registrar data do envio de email no checklist
        uses: actions/github-script@v7
        with:
          script: |
            let body = context.payload.comment.body || "";
            if (!body.includes("### Checklist de Provisionamento")) return;

            const sender = context.payload.sender.login;
            const regexEmailChecked = /- \[x\] (Email enviado \([^)\n\r]+\))(?:\s*\(Data de envio:.*?\))?$/m;
            const regexEmailUnchecked = /- \[ \] (Email enviado \([^)\n\r]+\))(?:\s*\(Data de envio:.*?\))?$/m;

            let alterado = false;

            if (regexEmailChecked.test(body)) {
              const match = body.match(regexEmailChecked);
              if (!match[0].includes("(Data de envio:")) {
                const now = new Date();
                const dataFormatada = new Intl.DateTimeFormat('pt-BR', {
                  timeZone: 'America/Sao_Paulo',
                  day: '2-digit',
                  month: '2-digit',
                  year: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit',
                }).format(now).replace(',', ' às');

                body = body.replace(regexEmailChecked, `- [x] $1 (Data de envio: ${dataFormatada} por \`@${sender}\`)`);
                alterado = true;
              }
            } else if (regexEmailUnchecked.test(body)) {
              const match = body.match(regexEmailUnchecked);
              if (match[0].includes("(Data de envio:")) {
                body = body.replace(regexEmailUnchecked, `- [ ] $1`);
                alterado = true;
              }
            }

            if (alterado) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                body: body,
              });
            }
