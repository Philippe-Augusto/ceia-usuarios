name: Atualizar título da issue com nome do solicitante

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  atualizar-titulo:
    if: contains(github.event.issue.labels.*.name, 'novo-acesso') || contains(github.event.issue.labels.*.name, 'acesso-cluster-adicional')
    runs-on: ubuntu-latest
    steps:
      - name: Extrair nome/usuário e atualizar título
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const labels = context.payload.issue.labels.map(l => l.name);

            function extrairCampo(label) {
              const regex = new RegExp(`### ${label}\\s*\\n+([^\\n#]+)`);
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            }

            let valor = null;
            let prefixo = null;

            if (labels.includes('novo-acesso')) {
              valor = extrairCampo('Nome completo do pesquisador');
              prefixo = '[Acesso hpc-spark-45]';
            } else if (labels.includes('acesso-cluster-adicional')) {
              valor = extrairCampo('Usuário ou email já cadastrado no ambiente');
              prefixo = '[Acesso Adicional hpc-spark-45]';
            }

            if (valor) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title: `${prefixo} ${valor}`,
              });
            }
