name: Atualizar título e checklist da issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  inicializar-issue:
    if: contains(github.event.issue.labels.*.name, 'novo-acesso') || contains(github.event.issue.labels.*.name, 'acesso-cluster-adicional')
    runs-on: ubuntu-latest
    steps:
      - name: Processar título e criar checklist de administradores
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const labels = context.payload.issue.labels.map(l => l.name);

            function extrairCampo(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`### ${escaped}\\s*\\n+([^\\n#]+)`);
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            }

            const clusterRaw = extrairCampo('Plataforma / Cluster Desejado') || 'Cluster';
            let clusterNome = 'Cluster';
            if (clusterRaw.includes('Spark')) clusterNome = 'Spark';
            else if (clusterRaw.includes('H100')) clusterNome = 'H100';
            else if (clusterRaw.includes('B200')) clusterNome = 'B200';
            else if (clusterRaw.includes('A100')) clusterNome = 'A100';
            else clusterNome = clusterRaw.split('(')[0].trim();

            let valor = null;
            let prefixo = null;
            let checklistBody = null;

            if (labels.includes('novo-acesso')) {
              valor = extrairCampo('Nome completo do pesquisador');
              prefixo = `[Acesso ${clusterNome}]`;
              checklistBody = `### Checklist de Provisionamento (Administradores)\n\n` +
                `- [ ] CRIAR USUARIO BCM\n` +
                `- [ ] COLOCAR NO GRUPO DO CLUSTER (${clusterNome.toUpperCase()})\n` +
                `- [ ] CRIAR CERTIFICADO NO PFSENSE\n` +
                `- [ ] ENVIAR USUARIO/SENHA, ARQUIVO DE VPN, IP DA MÁQUINA E MANUAL DE USO`;
            } else if (labels.includes('acesso-cluster-adicional')) {
              valor = extrairCampo('Usuário ou email já cadastrado no ambiente');
              prefixo = `[Acesso Adicional ${clusterNome}]`;
              checklistBody = `### Checklist de Provisionamento (Administradores)\n\n` +
                `- [ ] COLOCAR NO GRUPO DO CLUSTER (${clusterNome.toUpperCase()})\n` +
                `- [ ] ENVIAR INSTRUÇÕES E MANUAL DE USO DO NOVO AMBIENTE`;
            }

            if (valor) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                title: `${prefixo} ${valor}`,
              });
            }

            if (checklistBody) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: checklistBody,
              });
            }
