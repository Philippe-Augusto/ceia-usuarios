name: Atualizar título e checklist da issue

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [edited]

permissions:
  issues: write

jobs:
  inicializar-issue:
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'novo-acesso') || contains(github.event.issue.labels.*.name, 'acesso-cluster-adicional'))
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar título e dados para cadastro; criar checklist
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const body = context.payload.issue.body || "";
            const labels = context.payload.issue.labels.map(l => l.name);

            function extrairCampo(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const regex = new RegExp(`### ${escaped}\\s*\\n+([^\\n#]+)`);
              const match = body.match(regex);
              const valor = match ? match[1].trim() : "";
              return valor === "_No response_" ? "" : valor;
            }

            // Opção do formulário -> nome no título e grupo do FreeIPA
            const clusters = [
              { chave: 'H100', nome: 'DGX H100', grupo: 'group_dgx-h100-<numero>' },
              { chave: 'B200', nome: 'DGX B200', grupo: 'group_dgx-b200-<numero>' },
              { chave: 'Spark Slurm', nome: 'Spark Slurm', grupo: 'hpc-spark-45' },
              { chave: 'Spark Notebook', nome: 'Spark Notebook', grupo: 'notebook-spark' },
            ];
            const clusterRaw = extrairCampo('Plataforma / Cluster Desejado');
            const cluster = clusters.find(c => clusterRaw.includes(c.chave))
              || { nome: 'Outro', grupo: '(definir: ver Observações)' };

            // user_ + primeiro nome + último sobrenome, minúsculo e sem acento
            function gerarUsuario(nomeCompleto) {
              const normalizar = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]/g, '');
              const sufixos = new Set(['junior', 'jr', 'filho', 'neto', 'sobrinho']);
              const palavras = nomeCompleto.split(/\s+/).map(normalizar).filter(Boolean);
              if (palavras.length === 0) return '(conferir: nome vazio)';
              const sobrenomes = palavras.slice(1).filter(p => !sufixos.has(p));
              const ultimo = sobrenomes.at(-1) || palavras.slice(1).at(-1) || '';
              return `user_${palavras[0]}${ultimo}`.slice(0, 32);
            }

            // Sem crases: o valor vai dentro de um bloco de código
            const limpar = s => (s || '').replace(/`/g, '').trim();

            let valorTitulo = null;
            let prefixo = null;
            let dados = null;
            let checklist = null;

            if (labels.includes('novo-acesso')) {
              const nomeCompleto = extrairCampo('Nome completo do pesquisador');
              valorTitulo = nomeCompleto;
              prefixo = `[Acesso ${cluster.nome}]`;
              dados = [
                `usuario: ${gerarUsuario(nomeCompleto)}`,
                `email: ${limpar(extrairCampo('Email'))}`,
                `grupo: ${cluster.grupo}`,
              ];
              checklist = `- [ ] Email enviado (Usuário/Senha, Arquivo de VPN e Manual de Uso)`;
            } else if (labels.includes('acesso-cluster-adicional')) {
              valorTitulo = extrairCampo('Usuário ou email já cadastrado no ambiente');
              prefixo = `[Acesso Adicional ${cluster.nome}]`;
              dados = [
                `usuario: ${limpar(valorTitulo)}`,
                `grupo: ${cluster.grupo}`,
              ];
              checklist = `- [ ] Email enviado (Instruções e Manual de Uso do novo ambiente)`;
            }

            if (valorTitulo) {
              await github.rest.issues.update({ owner, repo, issue_number, title: `${prefixo} ${valorTitulo}` });
            }
            if (!dados) return;

            const secaoDados = `### Dados para cadastro (Administradores)\n\n\`\`\`text\n${dados.join('\n')}\n\`\`\`\n\n`;
            const tituloChecklist = '### Checklist de Provisionamento (Administradores)';

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existente = comments.find(c => c.user.type === 'Bot' && c.body.includes(tituloChecklist));

            if (!existente) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${secaoDados}${tituloChecklist}\n\n${checklist}`,
              });
              return;
            }

            // Issue editada: troca só os dados e mantém o checklist como está
            const inicioChecklist = existente.body.indexOf(tituloChecklist);
            const novoCorpo = secaoDados + existente.body.slice(inicioChecklist);
            if (novoCorpo !== existente.body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existente.id, body: novoCorpo });
            }

  registrar-data-checklist:
    if: github.event_name == 'issue_comment' && github.event.comment.user.type == 'Bot' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Registrar data do envio de email no checklist
        uses: actions/github-script@v7
        with:
          script: |
            let body = context.payload.comment.body || "";
            if (!body.includes("### Checklist de Provisionamento")) return;

            const sender = context.payload.sender.login;
            const regexEmailChecked = /- \[x\] (Email enviado \([^)\n\r]+\))(?:\s*\(Data de envio:.*?\))?$/m;
            const regexEmailUnchecked = /- \[ \] (Email enviado \([^)\n\r]+\))(?:\s*\(Data de envio:.*?\))?$/m;

            let alterado = false;

            if (regexEmailChecked.test(body)) {
              const match = body.match(regexEmailChecked);
              if (!match[0].includes("(Data de envio:")) {
                const now = new Date();
                const dataFormatada = new Intl.DateTimeFormat('pt-BR', {
                  timeZone: 'America/Sao_Paulo',
                  day: '2-digit',
                  month: '2-digit',
                  year: 'numeric',
                  hour: '2-digit',
                  minute: '2-digit',
                }).format(now).replace(',', ' às');

                body = body.replace(regexEmailChecked, `- [x] $1 (Data de envio: ${dataFormatada} por \`@${sender}\`)`);
                alterado = true;
              }
            } else if (regexEmailUnchecked.test(body)) {
              const match = body.match(regexEmailUnchecked);
              if (match[0].includes("(Data de envio:")) {
                body = body.replace(regexEmailUnchecked, `- [ ] $1`);
                alterado = true;
              }
            }

            if (alterado) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                body: body,
              });
            }
